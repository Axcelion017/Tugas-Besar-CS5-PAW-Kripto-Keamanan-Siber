services:
  # 1. Aplikasi Web JagaMedis
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-resilio_sec_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diatur di .env}@db:5432/${POSTGRES_DB:-resilio_health}?schema=public
    depends_on:
      db:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false
    networks:
      - resilio_internal_net

  # 2. Database PostgreSQL 17 (Terisolasi - Port TIDAK Dipublikasikan ke Publik)
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resilio_sec_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diatur di .env}
      POSTGRES_DB: ${POSTGRES_DB:-resilio_health}
    volumes:
      - pgdata_secure:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resilio_sec_user} -d ${POSTGRES_DB:-resilio_health}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resilio_internal_net

networks:
  resilio_internal_net:
    driver: bridge
    internal: false

volumes:
  pgdata_secure:
    driver: local
